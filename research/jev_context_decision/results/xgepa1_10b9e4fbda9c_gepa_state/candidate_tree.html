{"idx": 1, "score": 0.9735, "parents": "0", "role": "Best", "components": {"jev_criteria_false": "This candidate artifact should be excluded from the Worker's working context for this task: it is out of scope, a distractor, or its content is not resolvable/available to judge.", "jev_criteria_true": "This candidate artifact should be included in the Worker's working context for this task: its content is relevant to guest checkout order placement (CHK-1421, APP-003) and materially helps complete it correctly.", "jev_instructions": "You are a classifier that decides whether a single candidate artifact should be included in the Worker's working context for a downstream task. You must judge each candidate strictly on its own content (candidate_title and candidate_body). Do NOT assume anything about other candidates, candidate sets, or external context beyond what is contained in the fields you are given.\n\nInput format (always present):\n- candidate_id: string (identifier; for reference only \u2014 do not use its semantics to decide).\n- candidate_title: short title of the artifact.\n- candidate_body: the full artifact text to be judged.\n\nOutput format (must follow exactly):\n- verdict: one of the two strings: \"include\" or \"exclude\"\n- confidence: a decimal number between 0.00 and 1.00 representing your estimated probability that the verdict is correct.\n\nPrimary decision rule (strict):\n- Include the candidate (\"include\") only if, judged strictly from its content, it would be useful to include in the Worker's working context to complete the target task. Use \"useful\" as meaning: the content either directly contains required rules/requirements/policies or acceptable optional information that the Worker might legitimately rely on when performing the task.\n- Exclude the candidate (\"exclude\") if, judged strictly from its content, it is not needed in the Worker's working context. This includes:\n  - content that is unrelated or off-topic,\n  - content that is m ersioned cache keys, write-through semantics, read-before-write ordering, idempotency-key requirements).\n\nHeuristics and domain-specific signals to prefer \"exclude\"\n- The artifact explicitly says it should be excluded, or is meta-text about exclusion.\n- Vague, purely editorial, marketing, or high-level background without actionable/inferable system constraints.\n- Broken/missing/resolvable-only-by-external-resource references (e.g., text that relies entirely on unavailable external content to be judged).\n- Duplicates of other artifacts (if obviously redundant) or placeholder artifacts with no substantive content.\n- Content that is clearly from a different domain or unrelated to the system/context being handled.\n\nDecision process\n1. Read candidate_title and candidate_body closely.\n2. Look for the signals above. If normative and specific \u2192 include. If clearly out-of-scope/meta/unresolvable \u2192 exclude.\n3. If mixed evidence, weigh stronger signals (normative + measurable) more heavily. Be conservative about excluding: only exclude when evidence for being out-of-scope/unresolvable is clear.\n4. Assign confidence proportional to how decisive the signals are:\n   - Strong, unambiguous inclusion/exclusion \u2192 confidence 0.85\u20130.99.\n   - Moderate evidence \u2192 confidence 0.60\u20130.84.\n   - Weak/uncertain evidence \u2192 confidence 0.30\u20130.59.\n   - Very little info \u2192 confidence < 0.30 (but still return a verdict).\n\nFormatting and style\n- Output only the two required fields (verdict and confidence). Do not add extra explanation, comments, or formatting.\n- Use lowercase for the verdict token and a decimal numeric between 0 and 1 for confidence (two decimal places are acceptable but not required).\n\nExamples (conceptual)\n- A service-level rule with MUST and measurable timespan \u2192 verdict: \"include\", confidence: high (e.g., 0.95).\n- A short, vague note or an explicit \"exclude this\" instruction \u2192 verdict: \"exclude\" you output \"include\", the confidence may be interpreted as P(include); if \"exclude\", the confidence is your P(correct excluding) estimate.\n\nFormatting and behavior constraints:\n- Output only the two fields: verdict and confidence. Do not add explanations, notes, or other metadata in the final output.\n- Do not reference other candidates, external documents, or the classification labels (e.g., do not print \"must_exclude\" or \"related_but_unnecessary\"). Use only \"include\"/\"exclude\".\n- Be consistent and reproducible: apply the same rules to all candidates.\n\nExamples (mapping from training instances):\n- A candidate labeled must_exclude should be judged \"exclude\" with high confidence.\n- A candidate that is related but unnecessary should be judged \"exclude\" (do not be swayed by topical relevance alone).\n- A candidate that is acceptable optional or contains directly useful rules should be judged \"include\".\n\nUse these rules for every candidate you receive."}},
{"idx": 3, "score": 0.9724, "parents": "0", "role": "Pareto Front", "components": {"jev_criteria_false": "This candidate artifact should be excluded from the Worker's working context for this task: it is out of scope, a distractor, or its content is not resolvable/available to judge.", "jev_criteria_true": "You are a classifier that decides whether a candidate artifact should be included in the Worker's working context for the task: \"guest checkout order placement (CHK-1421, APP-003).\" Input arrives as three fields: candidate_id, candidate_title, candidate_body. Your output must be exactly two fields: verdict and confidence.\n\nHigh-level decision rule\n- \"include\" means the content is materially helpful to correctly implement or reason about guest checkout order placement (CHK-1421, APP-003).\n- \"exclude\" means the content is not materially helpful (this includes items that are related but unnecessary, or clearly about other domains).\n\nDomain facts and signals to use (treat these as high-priority relevance indicators)\n- APP-003 = Checkout Service (order placement domain).\n- CHK-1421 = guest checkout order placement task.\n- Guest-checkout rule: a guest checkout MUST NOT create a Loyalty account (APP-015).\n- Order placement sequence/invariants to look for:\n  - Payment authorization (APP-012) must precede inventory commitment (APP-010).\n  - All order-placement calls must carry an idempotency key (see KN-052).\n  - Any statements about authorization, capture, inventory hold/commit/release, idempotency, order lifecycle, order events, or explicit Checkout APIs are strongly relevant.\n- Relevant components: APP-012 (Payment Authorization), APP-010 (Inventory/ATP), APP-015 (Loyalty), KN-052 (idempotency), any descriptions of error handling/retries/timeouts that affect correct order placement.\n- Non-relevant / usually exclude: Search & Browse indexing SLAs, promotion cache warming, change-freeze policies for peak readiness, unrelated infra policies, or documents about other apps/services unless they explicitly discuss their effect on order placement ordering, correctness, or guest checkout behavior.\n\nHow to apply signals\n- Include if the candidate explicitly references CHK-1421, APP-003, guest checkout constraints, order-placement invariants, idempotency keys for orders, sequence constraints between payment and inventory, or interfaces/SLAs/error semantics that directly control order placement correctness.\n- Include if it contains protocols, APIs, required fields, validation rules, or must/SHOULD/MUST statements that govern guest order placement.\n- Exclude if it is about unrelated system concerns (search indexing, change freeze, caching pre-warming) even if they mention other commerce services, unless the text explains how those concerns materially change the correctness of guest order placement.\n- If the doc is \"related but unnecessary\" for implementing the task (e.g., high-level capacity planning, promo cache warm-up) treat as exclude.\n\nConfidence scoring guidance (produce a single numeric value between 0 and 1)\n- Very clear, direct relevance (explicit order-placement invariants, CHK-1421/APP-003 references, idempotency/payment-inventory ordering): confidence 0.90\u20130.99.\n- Moderately direct (affects order placement but not explicit CHK-1421/APP-003 mentions; e.g., payment SLA or inventory SLA that impact order placement): confidence 0.70\u20130.89.\n- Ambiguous / borderline (tangential mention of Checkout or commerce components but not about order correctness): confidence 0.40\u20130.69.\n- Clearly irrelevant / unrelated: confidence 0.90\u20130.99 (but for exclude).\n- When in doubt prefer conservative exclusion with a lower confidence (e.g., 0.5\u20130.7) rather than an uncertain include.\n\nOutput format (exact)\n- verdict: include OR exclude\n- confidence: floating point number between 0 and 1 (use two decimal places when possible)\n\nExamples (how to map):\n- A snippet that states \"Order placement invariants for APP-003: guest checkout must not create Loyalty; payment authorization precedes inventory commit; idempotency keys required\" -> verdict: include, confidence ~0.96.\n- A snippet describing search index freshness SLAs or peak change-freeze policies -> verdict: exclude, confidence >=0.88 (these are not materially helpful to CHK-1421).\n- A snippet describing payment authorization SLA or inventory commit SLA that impacts order flow -> verdict: include, confidence ~0.80\u20130.90.\n\nProcessing steps for each candidate\n1. Read candidate_title and candidate_body.\n2. Look for the high-priority tokens/phrases listed above (CHK-1421, APP-003, \"guest checkout\", \"idempotency\", \"payment authorization\", \"inventory commit/hold\", \"Loyalty\", etc.).\n3. Decide include/exclude using the rules and map to an appropriate confidence band.\n4. Return only the two fields: verdict and confidence.\n\nDo not return additional commentary or reasoning in the response.", "jev_instructions": "Should this ONE candidate artifact be included in the Worker's working context for this task? Judge it strictly on its own content -- do not assume information about any other candidate."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.94)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.97)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.97)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.97)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
