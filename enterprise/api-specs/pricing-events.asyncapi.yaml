asyncapi: 2.6.0
info:
  title: Pricing Events
  version: 1.0.0
  description: >
    Kafka event contract published by the Pricing Service (APP-007), owned by TEAM-007.
    Emits price change and price-list activation events consumed by Cart (APP-004),
    Promotions (APP-008), Storefront (APP-001) and the Data Platform (APP-020). Schemas
    evolve backward-compatibly (CANON 4.8).
defaultContentType: application/json
servers:
  production:
    url: kafka.meridian.internal:9093
    protocol: kafka-secure
    description: Production Kafka backbone (mTLS, SASL).
channels:
  mcg.pricing.price-changed:
    description: Emitted when the effective price of a SKU changes in a region.
    subscribe:
      operationId: onPriceChanged
      message:
        $ref: '#/components/messages/PriceChanged'
  mcg.pricing.price-list-activated:
    description: Emitted when a price list becomes active.
    subscribe:
      operationId: onPriceListActivated
      message:
        $ref: '#/components/messages/PriceListActivated'
components:
  messages:
    PriceChanged:
      name: PriceChanged
      title: Price Changed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PriceChangedPayload'
    PriceListActivated:
      name: PriceListActivated
      title: Price List Activated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PriceListActivatedPayload'
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, occurredAt, source]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        source: { type: string, example: APP-007 }
        traceId: { type: string }
    PriceChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [sku, region, newPrice, currency]
          properties:
            sku: { type: string }
            region: { type: string, enum: [NA, LATAM, EU, APAC] }
            oldPrice: { type: number }
            newPrice: { type: number }
            currency: { type: string }
            priceListId: { type: string }
            effectiveFrom: { type: string, format: date-time }
    PriceListActivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [priceListId, region]
          properties:
            priceListId: { type: string }
            region: { type: string, enum: [NA, LATAM, EU, APAC] }
            currency: { type: string }
            skuCount: { type: integer }
