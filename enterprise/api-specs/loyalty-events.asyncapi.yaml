asyncapi: 2.6.0
info:
  title: Loyalty Events
  version: 1.0.0
  description: >
    Kafka event contract published by the Loyalty Service (APP-015), owned by TEAM-011.
    Emits points and tier change events consumed by Notifications (APP-023), the Customer
    Portal (APP-021), Marketing Automation (APP-016) and the Data Platform (APP-020).
    Schemas evolve backward-compatibly (CANON 4.8).
defaultContentType: application/json
servers:
  production:
    url: kafka.meridian.internal:9093
    protocol: kafka-secure
    description: Production Kafka backbone (mTLS, SASL).
channels:
  mcg.loyalty.points-earned:
    description: Emitted when a member earns points (typically from an order).
    subscribe:
      operationId: onPointsEarned
      message:
        $ref: '#/components/messages/PointsEarned'
  mcg.loyalty.tier-changed:
    description: Emitted when a member's tier is upgraded or downgraded.
    subscribe:
      operationId: onTierChanged
      message:
        $ref: '#/components/messages/TierChanged'
components:
  messages:
    PointsEarned:
      name: PointsEarned
      title: Points Earned
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PointsEarnedPayload'
    TierChanged:
      name: TierChanged
      title: Tier Changed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TierChangedPayload'
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, occurredAt, source]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        source: { type: string, example: APP-015 }
        traceId: { type: string }
    PointsEarnedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [customerId, points, balanceAfter]
          properties:
            customerId: { type: string }
            points: { type: integer }
            balanceAfter: { type: integer }
            orderRef: { type: string }
    TierChangedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [customerId, fromTier, toTier]
          properties:
            customerId: { type: string }
            fromTier: { type: string, enum: [bronze, silver, gold, platinum] }
            toTier: { type: string, enum: [bronze, silver, gold, platinum] }
            reason:
              type: string
              enum: [spend_threshold, downgrade_expiry, manual_adjustment]
